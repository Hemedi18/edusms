          format: date-time
          readOnly: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryAttempt'
          readOnly: true
      required:
      - attempts
      - created_at
      - endpoint
      - endpoint_name
      - endpoint_url
      - event_type
      - event_uid
      - id
    WebhookEventRequest:
      type: object
      properties:
        endpoint:
          type: string
          format: uuid
        event_uid:
          type: string
          minLength: 1
          maxLength: 48
        event_type:
          type: string
          minLength: 1
          maxLength: 48
        is_simulation:
          type: boolean
        payload: {}
        status:
          $ref: '#/components/schemas/WebhookEventStatusEnum'
        attempt_count:
          type: integer
          maximum: 32767
          minimum: 0
        max_attempts:
          type: integer
          maximum: 32767
          minimum: 0
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          maxLength: 255
      required:
      - endpoint
      - event_type
      - event_uid
    WebhookEventStatusEnum:
      enum:
      - pending
      - delivered
      - retrying
      - dead_letter
      type: string
      description: |-
        * `pending` - Pending
        * `delivered` - Delivered
        * `retrying` - Retrying with Backoff
        * `dead_letter` - Dead Letter (Max Retries Exhausted)
  securitySchemes:
    DeveloperApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped external developer API key (`edusms_live_...` or `edusms_sim_...`).
    GatewayDeviceToken:
      type: apiKey
      in: header
      name: X-Gateway-Token
      description: Paired Android SIM gateway credential (`edugw_...`).
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
