    MessageStatusEnum:
      enum:
      - pending_approval
      - queued
      - dispatched_to_device
      - submitted
      - delivered
      - delivery_unknown
      - simulated_sent
      - simulated_delivered
      - simulated_received
      - received
      - failed
      - expired
      - canceled
      type: string
      description: |-
        * `pending_approval` - Pending Human Approval
        * `queued` - Queued on Server
        * `dispatched_to_device` - Dispatched to Android Gateway
        * `submitted` - Accepted for Transmission (Not Yet Delivery-Confirmed)
        * `delivered` - Carrier Delivery Confirmed
        * `delivery_unknown` - Submitted — Carrier Delivery Report Unavailable
        * `simulated_sent` - Simulated Sent (Sandbox)
        * `simulated_delivered` - Simulated Delivered (Sandbox)
        * `simulated_received` - Simulated Inbound (Sandbox)
        * `received` - Received via SIM Gateway
        * `failed` - Failed
        * `expired` - Expired Before Transmission
        * `canceled` - Canceled
