components:
  schemas:
    AICallLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          format: uuid
          nullable: true
        provider_name:
          type: string
          readOnly: true
          default: ''
        inbound_message:
          type: string
          format: uuid
          nullable: true
        model_name:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/AICallLogStatusEnum'
        latency_ms:
          type: integer
          maximum: 2147483647
          minimum: 0
        prompt_chars:
          type: integer
          maximum: 2147483647
          minimum: 0
        response_chars:
          type: integer
          maximum: 2147483647
          minimum: 0
        response_preview:
          type: string
          maxLength: 320
        error_message:
          type: string
          maxLength: 255
        is_test:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - model_name
      - provider_name
      - status
    AICallLogStatusEnum:
      enum:
      - success
      - fallback_used
      - error
      - timeout
      - blocked_safety
      type: string
      description: |-
        * `success` - Success
        * `fallback_used` - Provider Failed — Deterministic Fallback Used
        * `error` - Error
        * `timeout` - Timeout
        * `blocked_safety` - Blocked by Safety Guard
