            maxLength: 0
        masked_api_key:
          type: string
          readOnly: true
        has_api_key:
          type: boolean
          readOnly: true
        model_name:
          type: string
          maxLength: 80
        temperature:
          type: number
          format: double
        max_output_tokens:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_response_chars:
          type: integer
          maximum: 2147483647
          minimum: 0
        timeout_seconds:
          type: integer
          maximum: 32767
          minimum: 0
        max_retries:
          type: integer
          maximum: 32767
          minimum: 0
        is_enabled:
          type: boolean
        simulate_failure:
          type: boolean
