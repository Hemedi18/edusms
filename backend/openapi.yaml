openapi: 3.0.3
info:
  title: EduSMS Programmable SMS Gateway & Intelligent Automation API
  version: 1.0.0
  description: Production-oriented REST API for EduSMS (`/api/v1/`). Supports physical
    Android SIM gateways, strictly isolated Simulation Mode, consent-aware contact
    & group policies, deterministic keyword/regex and safe AI auto-replies, throttled
    bulk SMS campaigns, scoped API keys, and HMAC-SHA256 webhooks.
paths:
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      summary: Account analytics & time-series overview
      tags:
      - analytics
      security:
      - jwtAuth: []
      - DeveloperApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - api_key
          - device
          - system
          - user
        description: |-
          * `user` - User
          * `api_key` - API Key
          * `device` - Gateway Device
          * `system` - System
      - in: query
        name: event_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - audit-events
      security:
      - jwtAuth: []
      - DeveloperApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
